<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>メモ</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Meiryo',sans-serif;background:#f0f2f5;color:#1f2333;min-height:100vh;padding-bottom:70px}
.header{background:linear-gradient(135deg,#4f46e5,#4338ca);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:17px;font-weight:700}
.header-sub{font-size:11px;opacity:.8;margin-top:2px}
.header button.icon{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:10px;width:34px;height:34px;font-size:15px;cursor:pointer}

.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e0e0e0;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.nav-item{flex:1;text-align:center;padding:8px 4px;font-size:10px;color:#888;cursor:pointer;transition:color .2s}
.nav-item.active{color:#4f46e5;font-weight:700}
.nav-item svg{display:block;margin:0 auto 2px}

.fab{position:fixed;right:16px;bottom:78px;width:52px;height:52px;border-radius:50%;background:#4f46e5;color:#fff;border:none;font-size:26px;box-shadow:0 4px 12px rgba(79,70,229,.4);cursor:pointer;z-index:90;display:flex;align-items:center;justify-content:center}

.page{display:none;padding:14px;max-width:640px;margin:0 auto}
.page.active{display:block}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:16px;font-size:12px;font-weight:700;background:#fff;color:#64748b;border:1px solid #e2e8f0;cursor:pointer;white-space:nowrap}
.chip.active{color:#fff;border-color:transparent}

.search-box{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:13px;background:#fff;margin-bottom:10px}
.search-box:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}

.filter-tag{display:inline-flex;align-items:center;gap:6px;background:#eef2ff;color:#4338ca;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;margin-bottom:10px}
.filter-tag span{cursor:pointer;font-weight:900}

.note-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;gap:10px;cursor:pointer;border-left:4px solid #ccc}
.note-main{flex:1;min-width:0}
.note-badges{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}
.note-title{font-size:14px;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-body{font-size:12px;color:#64748b;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note-meta{font-size:10px;color:#94a3b8;margin-top:6px;display:flex;gap:8px;align-items:center}
.note-thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0;background:#f1f5f9}

.empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px}

.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-title{font-size:13px;font-weight:700;color:#4f46e5;margin-bottom:8px;display:flex;align-items:center;gap:6px}

.folder-card{background:#fff;border-radius:12px;padding:13px 14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.folder-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.folder-count{font-size:11px;color:#94a3b8;margin-top:2px}
.folder-del{background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:4px 6px}
.new-folder-row{display:flex;gap:6px;margin-bottom:12px}
.new-folder-row input{flex:1;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}

.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:#64748b;margin-bottom:4px;font-weight:600}
.form-group input[type=text],.form-group input[type=date],.form-group input[type=time],.form-group textarea,.form-group select{width:100%;padding:10px 11px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff;font-family:inherit}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.form-group textarea{resize:vertical;min-height:120px;line-height:1.5}

.cat-select{display:flex;gap:7px;flex-wrap:wrap}
.cat-btn{flex:1;min-width:70px;padding:10px 6px;border-radius:10px;border:2px solid #e2e8f0;background:#fff;text-align:center;cursor:pointer;font-size:12px;font-weight:700;color:#64748b}
.cat-btn .icon{font-size:18px;display:block;margin-bottom:2px}
.cat-btn.active{border-color:currentColor}

.photo-area{border:2px dashed #d1d5db;border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:#94a3b8;font-size:12px;margin-top:2px}
.photo-area:hover{border-color:#4f46e5;color:#4f46e5}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photo-item{position:relative;aspect-ratio:1}
.photo-item img{width:100%;height:100%;object-fit:cover;border-radius:6px;cursor:pointer}
.photo-item .rm{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#dc2626;color:#fff;border:2px solid #fff;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-secondary{background:#f1f5f9;color:#475569}
.btn-danger{background:#fef2f2;color:#dc2626}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{width:auto;flex:1}

.editor-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.back-btn{background:none;border:none;color:#4f46e5;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal img{max-width:95vw;max-height:90vh;border-radius:8px}

.storage-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.storage-fill{height:100%;background:#4f46e5;transition:width .3s}
.storage-text{font-size:11px;color:#64748b;margin-top:6px}

.detail-badges{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.detail-title{font-size:19px;font-weight:700;margin-bottom:12px;line-height:1.4}
.detail-body{font-size:15px;line-height:1.8;color:#1f2333;white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.detail-meta{font-size:11px;color:#94a3b8;margin-top:6px}
.detail-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.detail-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}

.task-check{width:24px;height:24px;border-radius:50%;border:2px solid #cbd5e1;flex-shrink:0;margin-top:2px;cursor:pointer;background:#fff}
.task-check:active{transform:scale(.85);background:#e2e8f0}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div>
      <h1 id="headerTitle">📝 メモ</h1>
      <div class="header-sub" id="headerSub">思考・仕事・メモ・KEYを整理</div>
    </div>
  </div>
</div>

<!-- タスク -->
<div class="page" id="pageTasks">
  <div id="taskList"></div>
</div>

<!-- タスク詳細 -->
<div class="page" id="pageTaskDetail">
  <div class="editor-header">
    <button class="back-btn" onclick="showPage('pageTasks')">← 戻る</button>
    <button class="back-btn" onclick="editFromTaskDetail()">✏️ 編集</button>
  </div>
  <div class="card" id="taskDetailContent"></div>
  <button class="btn btn-danger" onclick="deleteFromTaskDetail()" style="margin-top:4px">🗑 削除</button>
</div>

<!-- タスク編集/新規作成 -->
<div class="page" id="pageTaskEditor">
  <div class="editor-header">
    <button class="back-btn" onclick="closeTaskEditor()">← 戻る</button>
    <button class="back-btn" id="deleteTaskBtn" style="color:#dc2626;display:none" onclick="deleteCurrentTask()">🗑 削除</button>
  </div>
  <div class="card">
    <div class="form-group">
      <label>タイトル</label>
      <input type="text" id="taskTitle" placeholder="タスク名">
    </div>
    <div class="form-group">
      <label>期限日</label>
      <input type="date" id="taskDueDate">
    </div>
    <div class="form-group">
      <label>時刻（任意）</label>
      <input type="time" id="taskDueTime">
    </div>
    <div class="form-group">
      <label>メモ</label>
      <textarea id="taskBody" placeholder="詳細（省略可）"></textarea>
    </div>
  </div>
  <button class="btn btn-primary" onclick="saveTask()">💾 保存する</button>
</div>

<!-- ホーム -->
<div class="page active" id="pageHome">
  <div class="chips" id="catChips"></div>
  <input type="text" class="search-box" id="searchBox" placeholder="🔍 タイトル・本文を検索" oninput="renderHome()">
  <div id="folderFilterTag"></div>
  <div id="noteList"></div>
</div>

<!-- フォルダ -->
<div class="page" id="pageFolders">
  <div class="card">
    <div class="card-title">📁 新しいフォルダ</div>
    <div class="new-folder-row">
      <input type="text" id="newFolderName" placeholder="フォルダ名を入力">
      <button class="btn btn-primary" style="width:auto" onclick="addFolder()">＋追加</button>
    </div>
  </div>
  <div id="folderList"></div>
</div>

<!-- 詳細表示 -->
<div class="page" id="pageDetail">
  <div class="editor-header">
    <button class="back-btn" onclick="showPage('pageHome')">← 戻る</button>
    <button class="back-btn" onclick="editFromDetail()">✏️ 編集</button>
  </div>
  <div class="card" id="detailContent"></div>
  <button class="btn btn-danger" onclick="deleteFromDetail()" style="margin-top:4px">🗑 削除</button>
</div>

<!-- 編集/新規作成 -->
<div class="page" id="pageEditor">
  <div class="editor-header">
    <button class="back-btn" onclick="closeEditor()">← 戻る</button>
    <button class="back-btn" id="deleteNoteBtn" style="color:#dc2626;display:none" onclick="deleteCurrentNote()">🗑 削除</button>
  </div>
  <div class="card">
    <div class="form-group">
      <label>カテゴリー</label>
      <div class="cat-select" id="catSelect"></div>
    </div>
    <div class="form-group">
      <label>フォルダ</label>
      <select id="editFolder" onchange="handleFolderSelect()"></select>
    </div>
    <div class="form-group">
      <label>タイトル</label>
      <input type="text" id="editTitle" placeholder="タイトル（省略可）">
    </div>
    <div class="form-group">
      <label>本文</label>
      <textarea id="editBody" placeholder="内容を入力..."></textarea>
    </div>
    <div class="form-group">
      <label>画像添付</label>
      <div class="photo-area" onclick="document.getElementById('photoInput').click()">📷 タップして画像を追加</div>
      <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">
      <div class="photo-grid" id="photoPreview"></div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="saveNote()">💾 保存する</button>
</div>

<!-- 設定 -->
<div class="page" id="pageSettings">
  <div class="card">
    <div class="card-title">💾 ストレージ使用量</div>
    <div class="storage-bar"><div class="storage-fill" id="storageFill"></div></div>
    <div class="storage-text" id="storageText"></div>
  </div>
  <div class="card">
    <div class="card-title">📦 データ管理</div>
    <button class="btn btn-secondary" onclick="exportData()" style="margin-bottom:6px">📤 エクスポート</button>
    <button class="btn btn-secondary" onclick="document.getElementById('importInput').click()" style="margin-bottom:6px">📥 インポート</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
    <button class="btn btn-danger" onclick="clearAllData()">🗑 全データ削除</button>
  </div>
</div>

<!-- 画像モーダル -->
<div class="modal" id="imgModal" onclick="this.classList.remove('active')">
  <img id="imgModalSrc">
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="fabDispatch()">＋</button>

<!-- ナビ -->
<div class="nav">
  <div class="nav-item" onclick="showPage('pageTasks')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>タスク
  </div>
  <div class="nav-item active" onclick="showPage('pageHome')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>メモ
  </div>
  <div class="nav-item" onclick="showPage('pageFolders')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>フォルダ
  </div>
  <div class="nav-item" onclick="showPage('pageSettings')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>設定
  </div>
</div>

<script>
const SK = 'memoAppData';
const categories = [
  {id:'thought', name:'思考', color:'#7c3aed', bg:'#f5f3ff', icon:'💭'},
  {id:'work',    name:'仕事', color:'#2563eb', bg:'#eff6ff', icon:'💼'},
  {id:'memo',    name:'メモ', color:'#d97706', bg:'#fffbeb', icon:'📝'},
  {id:'key',     name:'KEY', color:'#dc2626', bg:'#fef2f2', icon:'🔑'},
];
function catInfo(id){return categories.find(c=>c.id===id)||categories[2]}

function load(){
  const d = localStorage.getItem(SK);
  const parsed = d ? JSON.parse(d) : {};
  return {
    notes: Array.isArray(parsed.notes) ? parsed.notes : [],
    folders: Array.isArray(parsed.folders) ? parsed.folders : [],
    tasks: Array.isArray(parsed.tasks) ? parsed.tasks : []
  };
}
function save(d){
  try{
    localStorage.setItem(SK,JSON.stringify(d));
    return true;
  }catch(e){
    alert('保存に失敗しました。画像サイズが大きすぎるか、ストレージの空き容量が不足しています。');
    return false;
  }
}

let state = {
  currentPage: 'pageHome',
  categoryFilter: 'all',
  folderFilter: null,
  editingId: null,
  tempImages: [],
  detailId: null,
  detailImages: [],
  taskDetailId: null,
  editingTaskId: null
};

const headerMap = {
  pageTasks:      {icon:'✅', title:'タスク',     sub:'期限が近い順に表示'},
  pageHome:       {icon:'📝', title:'メモ',       sub:'思考・仕事・メモ・KEYを整理'},
  pageFolders:    {icon:'📁', title:'フォルダ',   sub:'メモをフォルダで整理'},
  pageSettings:   {icon:'⚙️', title:'設定',       sub:'データのバックアップ・削除'},
  pageDetail:     {icon:'📝', title:'メモ詳細',   sub:''},
  pageTaskDetail: {icon:'✅', title:'タスク詳細', sub:''},
  pageEditor:     {icon:'📝', title:'メモ編集',   sub:''},
  pageTaskEditor: {icon:'✅', title:'タスク編集', sub:''}
};

// --- ページ切り替え ---
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  state.currentPage = id;
  const navMap = {pageTasks:0, pageHome:1, pageFolders:2, pageSettings:3};
  document.querySelectorAll('.nav-item').forEach((n,i)=>n.classList.toggle('active', navMap[id]===i));
  document.getElementById('fabBtn').style.display = (id==='pageHome'||id==='pageTasks') ? 'flex' : 'none';
  document.querySelector('.nav').style.display =
    ['pageEditor','pageDetail','pageTaskEditor','pageTaskDetail'].includes(id) ? 'none' : 'flex';
  const h = headerMap[id];
  if(h){
    document.getElementById('headerTitle').textContent = `${h.icon} ${h.title}`;
    document.getElementById('headerSub').textContent = h.sub;
  }
  if(id==='pageHome')renderHome();
  if(id==='pageTasks')renderTasks();
  if(id==='pageFolders')renderFolders();
  if(id==='pageSettings')renderSettings();
}

function fabDispatch(){
  if(state.currentPage==='pageTasks') openTaskEditor();
  else openEditor();
}

// --- ホーム ---
function renderCatChips(){
  const chips = document.getElementById('catChips');
  let html = `<div class="chip ${state.categoryFilter==='all'?'active':''}" style="${state.categoryFilter==='all'?'background:#4f46e5':''}" onclick="setCatFilter('all')">すべて</div>`;
  categories.forEach(c=>{
    const active = state.categoryFilter===c.id;
    html += `<div class="chip ${active?'active':''}" style="${active?'background:'+c.color:''}" onclick="setCatFilter('${c.id}')">${c.icon} ${c.name}</div>`;
  });
  chips.innerHTML = html;
}
function setCatFilter(id){state.categoryFilter=id;renderHome()}

function renderHome(){
  renderCatChips();
  const data = load();
  const tagEl = document.getElementById('folderFilterTag');
  if(state.folderFilter){
    tagEl.innerHTML = `<div class="filter-tag">📁 ${escapeHtml(state.folderFilter)} <span onclick="clearFolderFilter()">✕</span></div>`;
  } else {
    tagEl.innerHTML = '';
  }

  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  let notes = data.notes.slice().sort((a,b)=>b.updatedAt-a.updatedAt);
  if(state.categoryFilter!=='all') notes = notes.filter(n=>n.category===state.categoryFilter);
  if(state.folderFilter) notes = notes.filter(n=>n.folder===state.folderFilter);
  if(q) notes = notes.filter(n=>(n.title||'').toLowerCase().includes(q) || (n.body||'').toLowerCase().includes(q));

  const list = document.getElementById('noteList');
  if(notes.length===0){
    list.innerHTML = '<div class="empty">メモがありません。右下の＋から追加しましょう</div>';
    return;
  }
  list.innerHTML = notes.map(n=>{
    const c = catInfo(n.category);
    const thumb = n.images && n.images.length>0 ? `<img class="note-thumb" src="${n.images[0]}">` : '';
    const date = new Date(n.updatedAt);
    const dateStr = `${date.getMonth()+1}/${date.getDate()} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    return `<div class="note-card" style="border-left-color:${c.color}" onclick="openDetail(${n.id})">
      <div class="note-main">
        <div class="note-badges">
          <span class="badge" style="background:${c.bg};color:${c.color}">${c.icon} ${c.name}</span>
          ${n.folder?`<span class="badge" style="background:#f1f5f9;color:#64748b">📁 ${escapeHtml(n.folder)}</span>`:''}
        </div>
        <div class="note-title">${escapeHtml(n.title) || '(無題)'}</div>
        <div class="note-body">${escapeHtml(n.body||'')}</div>
        <div class="note-meta">
          <span>${dateStr}</span>
          ${n.images && n.images.length>0 ? `<span>📷 ${n.images.length}</span>` : ''}
        </div>
      </div>
      ${thumb}
    </div>`;
  }).join('');
}

function clearFolderFilter(){state.folderFilter=null;renderHome()}

// --- フォルダ ---
function renderFolders(){
  const data = load();
  const list = document.getElementById('folderList');

  files.forEach(f=>{

    });
  });
  e.target.value='';
}

function compressImage(file, maxDim=1280, quality=0.75){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ev=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim}
          else{w=Math.round(w*maxDim/h);h=maxDim}
        }
        const canvas = document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>resolve(ev.target.result);
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// --- タスク ---
const urgencyStyle = {
  overdue:  {bg:'#fef2f2', color:'#dc2626', icon:'⚠'},
  today:    {bg:'#fffbeb', color:'#d97706', icon:'🔶'},
  upcoming: {bg:'#eff6ff', color:'#2563eb', icon:'📅'},
  none:     {bg:'#f8fafc', color:'#94a3b8', icon:'🗓'}
};

function taskUrgency(t){
  if(!t.dueDate) return 'none';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(t.dueDate+'T00:00:00');
  if(due < today) return 'overdue';
  if(due.getTime() === today.getTime()) return 'today';
  return 'upcoming';
}

function formatDueBadge(t){
  const level = taskUrgency(t);
  const s = urgencyStyle[level];
  if(!t.dueDate) return {level, ...s, text:'期限なし'};
  const [y,m,d] = t.dueDate.split('-').map(Number);
  const weekday = ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()];
  const timeStr = t.dueTime ? ` ${t.dueTime}` : '';
  let text;
  if(level==='overdue') text = `${m}/${d}(${weekday})${timeStr} 期限切れ`;
  else if(level==='today') text = `本日${timeStr}が期限`;
  else text = `${m}/${d}(${weekday})${timeStr}`;
  return {level, ...s, text};
}

function taskSortKey(t){
  if(!t.dueDate) return Infinity;
  const time = t.dueTime || '23:59';
  return new Date(`${t.dueDate}T${time}`).getTime();
}

function sortTasks(tasks){
  return tasks.slice().sort((a,b)=>{
    const ka = taskSortKey(a), kb = taskSortKey(b);
    if(ka!==kb) return ka-kb;
    return b.createdAt - a.createdAt;
  });
}

function renderTasks(){
  const data = load();
  const list = document.getElementById('taskList');
  const tasks = sortTasks(data.tasks);
  if(tasks.length===0){
    list.innerHTML = '<div class="empty">タスクがありません。右下の＋から追加しましょう</div>';
    return;
  }
  list.innerHTML = tasks.map(t=>{
    const b = formatDueBadge(t);
    return `<div class="note-card" style="border-left-color:${b.color}">
      <div class="task-check" onclick="completeTask(event,${t.id})"></div>
      <div class="note-main" onclick="openTaskDetail(${t.id})">
        <div class="note-title">${escapeHtml(t.title) || '(無題タスク)'}</div>
        ${t.body ? `<div class="note-body">${escapeHtml(t.body)}</div>` : ''}
        <div class="note-badges" style="margin-top:6px">
          <span class="badge" style="background:${b.bg};color:${b.color}">${b.icon} ${b.text}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

    task.updatedAt = now;
  } else {

      id: now,
      title, body, dueDate, dueTime,
      createdAt: now,
      updatedAt: now
    });
  }
  if(save(data)){

function renderSettings(){
  const raw = localStorage.getItem(SK) || '';
  const bytes = new Blob([raw]).size;
  const mb = bytes/1024/1024;
  const limitMb = 5; // localStorageのおおよその上限目安
  const pct = Math.min(100, (mb/limitMb)*100);
  document.getElementById('storageFill').style.width = pct+'%';
  document.getElementById('storageFill').style.background = pct>85 ? '#dc2626' : (pct>60 ? '#d97706' : '#4f46e5');
  document.getElementById('storageText').textContent = `約 ${mb.toFixed(2)}MB 使用中（目安上限 ${limitMb}MB）`;
}

function exportData(){
  const d = load();
  const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'メモデータ_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importData(e){
  const f = e.target.files[0]; if(!f)return;
  const r = new FileReader();
  r.onload = ev=>{
    try{
      const d = JSON.parse(ev.target.result);
      if(Array.isArray(d.notes) && Array.isArray(d.folders)){
        if(!Array.isArray(d.tasks)) d.tasks = [];
        if(confirm('現在のデータを上書きしてインポートしますか？')){
          save(d);
          alert('インポート完了');
          showPage('pageHome');
        }
      } else {
        alert('無効なデータです');
      }
    }catch{alert('読み込みに失敗しました')}
  };
  r.readAsText(f);
  e.target.value='';
}

function clearAllData(){
  if(!confirm('全データを削除しますか？'))return;
  if(!confirm('本当に削除しますか？この操作は取り消せません'))return;
  localStorage.removeItem(SK);
  alert('削除しました');
  showPage('pageHome');
}

// --- ユーティリティ ---
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;')}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

renderHome();
